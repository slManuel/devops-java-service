apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: production
resources:
  - ../../k8s
patches:
  - target:
      kind: Namespace
    patch: |-
      - op: replace
        path: /metadata/labels/environment
        value: production
  - target:
      kind: VaultAuth
      name: microservicio
    patch: |-
      - op: replace
        path: /spec/mount
        value: production
  - target:
      kind: VaultStaticSecret
      name: vault-config
    patch: |-
      - op: replace
        path: /spec/path
        value: environments/production/app
  - target:
      kind: SecretProviderClass
      name: vault-config
    patch: |-
      - op: replace
        path: /spec/parameters/vaultAuthMountPath
        value: production
      - op: replace
        path: /spec/parameters/objects
        value: |
          - objectName: application.properties
            secretPath: kv/data/environments/production/config
            secretKey: property
