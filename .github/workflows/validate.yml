name: Validate Java and deployment
on:
  push:
    branches: [develop, qa, main]
  pull_request:
    branches: [develop, qa, main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify promotion and shared pipeline contracts
        run: python3 scripts/check-profile-parity.py
      - name: Test environment deployment and rollback guards
        run: |
          python3 scripts/test_deploy_environments.py
          python3 scripts/test_release_promotion.py
      - name: Java 21 integration tests
        run: docker run --rm --user "$(id -u):$(id -g)" -e DEMO_MESSAGE=local-validation -v "$PWD:/src" -w /src eclipse-temurin:21-jdk@sha256:3e3c176ffed168beb42c607be9bc1639b466cf00261a0fb04425562c9d0c5c2b sh scripts/test.sh
      - run: |
          for script in scripts/*.sh; do sh -n "$script"; done
          docker pull ghcr.io/yannh/kubeconform:v0.8.0
          sh scripts/validate-manifests.sh
