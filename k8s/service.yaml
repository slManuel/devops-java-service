apiVersion: v1
kind: Service
metadata:
  name: devops-java-service
  namespace: development
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: 'true'
spec:
  type: LoadBalancer
  # Replace with the evaluator's public /32 before applying. Documentation-only range fails closed.
  loadBalancerSourceRanges: [198.51.100.0/24]
  selector:
    app: devops-java-service
  ports:
    - name: http
      port: 80
      targetPort: http
