apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-java-service
  namespace: development
spec:
  replicas: 2
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 180
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: devops-java-service
  template:
    metadata:
      labels:
        app: devops-java-service
    spec:
      serviceAccountName: microservicio
      automountServiceAccountToken: false
      nodeSelector:
        workload: microservicio
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: app
        image: ghcr.io/slmanuel/devops-java-service:REPLACE_COMMIT
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: DEMO_MESSAGE
          valueFrom:
            secretKeyRef:
              name: pipeline-env
              key: DEMO_MESSAGE
        - name: VSO_FEATURE_FLAG
          valueFrom:
            secretKeyRef:
              name: vault-config
              key: FEATURE_FLAG
        - name: EXPOSE_DEMO_VALUE
          value: 'true'
        - name: CONFIG_PATH
          value: /app/config/application.properties
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 256Mi
        startupProbe:
          httpGet:
            path: /health/ready
            port: http
          failureThreshold: 30
          periodSeconds: 2
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health/live
            port: http
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: config
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: vault-config
      - name: tmp
        emptyDir:
          medium: Memory
          sizeLimit: 32Mi
